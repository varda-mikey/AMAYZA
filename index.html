<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AMAYZA Support App</title><link rel="icon" href="favicon.svg"><style>*{box-sizing:border-box}body{margin:0;color:#161616;font-family:Arial,sans-serif;background:#f5f6f8}header{display:flex;align-items:center;gap:20px;padding:18px 28px;background:#171717;color:white}header b{font-size:23px;letter-spacing:3px}header span{font-size:14px;color:#dbbc65}header a{margin-left:auto;color:#eee;font-size:14px}nav{display:flex;align-items:center;gap:12px;padding:15px 28px;background:white;border-bottom:1px solid #ddd}label{font-size:14px}select,button{font:inherit;padding:11px 16px;border-radius:8px;border:1px solid #ddd;background:white;cursor:pointer}button.active{background:#171717;color:#fff;border-color:#171717}select{margin-right:auto;max-width:380px}iframe{display:block;border:0;width:100%;height:calc(100dvh - 141px);background:#f5f6f8}#notice{padding:16px 28px;font-size:14px}#notice:empty{display:none}@media(max-width:650px){header{padding:16px;gap:10px}header b{font-size:20px}header span{display:none}nav{padding:12px;flex-wrap:wrap;gap:8px}nav label{display:none}select{width:100%;max-width:none}nav button{flex:1}iframe{height:calc(100dvh - 186px)}}</style></head><body><header><b>AMAYZA</b><span>SUPPORT APP</span><a href="admin.html?v=4">Admin Studio</a></header><nav aria-label="Tools"><label for="preset">Choose preset</label><select id="preset" disabled><option>Loading presets…</option></select><button id="price" class="active" aria-pressed="true">Price Tag Maker</button><button id="id" aria-pressed="false">ID Maker</button></nav><div id="notice" role="status"></div><iframe id="workspace" title="AMAYZA Maker"></iframe><script>
let tool='price',presets=[];const frame=document.getElementById('workspace');function open(){const p=presets.find(p=>p.id===document.getElementById('preset').value);if(!p)return;frame.src=tool+'.html?v=4&brand='+encodeURIComponent(p.brand)+'&preset='+encodeURIComponent(p.id);frame.title='AMAYZA '+(tool==='price'?'Price Tag Maker':'ID Maker');for(const k of ['price','id']){document.getElementById(k).classList.toggle('active',tool===k);document.getElementById(k).setAttribute('aria-pressed',tool===k)}}document.getElementById('preset').onchange=open;for(const k of ['price','id'])document.getElementById(k).onclick=()=>{tool=k;open()};fetch('presets.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{if(!Array.isArray(d.presets)||!d.presets.length)throw Error();presets=d.presets;const s=document.getElementById('preset');s.innerHTML='';for(const p of presets){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;s.append(o)}s.disabled=false;open()}).catch(()=>{document.getElementById('notice').textContent='Unable to load published presets. Please refresh the page.'});
</script></body></html>
