<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AMAYZA Support App</title><link rel="icon" href="favicon.svg"><style>*{box-sizing:border-box}body{margin:0;color:#161616;font-family:Arial,sans-serif;background:#f5f6f8}header{display:flex;align-items:center;gap:20px;padding:18px 28px;background:#171717;color:white}header b{font-size:23px;letter-spacing:3px}header span{font-size:14px;color:#dbbc65}nav{display:flex;align-items:center;gap:12px;padding:15px 28px;background:white;border-bottom:1px solid #ddd}label{font-size:14px}select,button{font:inherit;padding:11px 16px;border-radius:8px;border:1px solid #ddd;background:white;cursor:pointer}button.active{background:#171717;color:#fff;border-color:#171717}select{margin-right:auto;max-width:280px}iframe{display:block;border:0;width:100%;height:calc(100dvh - 141px);background:#f5f6f8}@media(max-width:650px){header{padding:16px;gap:10px}header b{font-size:20px}nav{padding:12px;flex-wrap:wrap;gap:8px}nav label{display:none}select{width:100%;max-width:none}nav button{flex:1}iframe{height:calc(100dvh - 186px)}}</style></head><body><header><b>AMAYZA</b><span>SUPPORT APP</span></header><nav aria-label="Tools"><label for="brand">Brand</label><select id="brand"><option value="perfume">D.A.Y. & COLE · Scents</option><option value="beverage">Beverages · Yellow theme</option></select><button id="price" class="active" aria-pressed="true">Price Tag Maker</button><button id="id" aria-pressed="false">ID Maker</button></nav><iframe id="workspace" title="AMAYZA Price Tag Maker" src="price.html?v=3&brand=perfume"></iframe><script>let tool='price';const frame=document.getElementById('workspace');function open(){const brand=document.getElementById('brand').value;frame.src=tool+'.html?v=3&brand='+brand;frame.title='AMAYZA '+(tool==='price'?'Price Tag Maker':'ID Maker');for(const k of ['price','id']){document.getElementById(k).classList.toggle('active',tool===k);document.getElementById(k).setAttribute('aria-pressed',tool===k)}}document.getElementById('brand').onchange=open;for(const k of ['price','id'])document.getElementById(k).onclick=()=>{tool=k;open()};</script></body></html>
